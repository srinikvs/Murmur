<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Murmur</title>
  <meta name="description" content="Murmur modes: cursor flock, Koya fish, Diwali rockets." />
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <div class="brand">
      <h1>Murmur</h1>
      <p>cursors · koya fish · diwali rockets</p>
    </div>
    <aside class="panel" data-ui data-testid="murmur-drawer">
      <div class="panel-head">
        <strong>Rules</strong>
        <button type="button" id="scatter" data-testid="scatter" data-ui>Scatter</button>
      </div>
      <fieldset class="modes" data-ui>
        <legend>Mode</legend>
        <label><input id="mode-cursors" data-testid="mode-cursors" data-mode="cursors" type="checkbox" checked /> Cursors</label>
        <label><input id="mode-koya" data-testid="mode-koya" data-mode="koya" type="checkbox" /> Koya fish</label>
        <label><input id="mode-diwali" data-testid="mode-diwali" data-mode="diwali" type="checkbox" /> Diwali rockets</label>
      </fieldset>
      <label class="row">Sep <input id="sep" data-ui type="range" min="0" max="3" step="0.05" /><span class="val" id="sep-val"></span></label>
      <label class="row">Align <input id="ali" data-ui type="range" min="0" max="3" step="0.05" /><span class="val" id="ali-val"></span></label>
      <label class="row">Cohere <input id="coh" data-ui type="range" min="0" max="3" step="0.05" /><span class="val" id="coh-val"></span></label>
      <label class="row">Avoid <input id="avo" data-ui type="range" min="0" max="4" step="0.05" /><span class="val" id="avo-val"></span></label>
      <label class="row">Speed <input id="spd" data-ui type="range" min="40" max="280" step="1" /><span class="val" id="spd-val"></span></label>
      <label class="row">Flock <input id="pop" data-ui type="range" min="20" max="400" step="1" /><span class="val" id="pop-val"></span></label>
      <div class="actions">
        <button type="button" id="pause" data-testid="pause" data-ui>Pause</button>
        <button type="button" id="reset" data-testid="reset" data-ui>Reset</button>
      </div>
      <p class="hint" id="mode-hint"></p>
      <p class="hint">One mode at a time. Space pause · R reset · S scatter</p>
    </aside>
  </div>
  <script type="module" src="src/flock.js"></script>
</body>
</html>
