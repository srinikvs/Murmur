<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Murmur</title>
  <meta name="description" content="A Reynolds boids murmuration with live sliders and cursor scatter." />
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <div class="brand">
      <h1>Murmur</h1>
      <p>separation · alignment · cohesion · scatter</p>
    </div>
    <aside class="panel">
      <div class="panel-head">
        <strong>Rules</strong>
        <button type="button" id="scatter">Scatter</button>
      </div>
      <label class="row">Sep <input id="sep" type="range" min="0" max="3" step="0.05" /><span class="val" id="sep-val"></span></label>
      <label class="row">Align <input id="ali" type="range" min="0" max="3" step="0.05" /><span class="val" id="ali-val"></span></label>
      <label class="row">Cohere <input id="coh" type="range" min="0" max="3" step="0.05" /><span class="val" id="coh-val"></span></label>
      <label class="row">Avoid <input id="avo" type="range" min="0" max="4" step="0.05" /><span class="val" id="avo-val"></span></label>
      <label class="row">Speed <input id="spd" type="range" min="40" max="280" step="1" /><span class="val" id="spd-val"></span></label>
      <label class="row">Flock <input id="pop" type="range" min="20" max="400" step="1" /><span class="val" id="pop-val"></span></label>
      <div class="actions">
        <button type="button" id="pause">Pause</button>
        <button type="button" id="reset">Reset</button>
      </div>
      <p class="hint">Space pause · R reset · S scatter · pointer avoids</p>
    </aside>
  </div>
  <script src="src/flock-math.js"></script>
  <script src="src/flock.js"></script>
</body>
</html>
